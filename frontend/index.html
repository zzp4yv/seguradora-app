<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguradora - CRUD Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-800">Seguradora - Gestão de Clientes</h1>

        <!-- Stats Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-lg shadow p-4">
                <h3 class="text-sm text-gray-500">Total de Clientes</h3>
                <p id="stat-total" class="text-2xl font-bold">0</p>
            </div>
            <div class="bg-white rounded-lg shadow p-4">
                <h3 class="text-sm text-gray-500">Políticas Ativas</h3>
                <p id="stat-active" class="text-2xl font-bold">0</p>
            </div>
            <div class="bg-white rounded-lg shadow p-4">
                <h3 class="text-sm text-gray-500">Prêmio Médio</h3>
                <p id="stat-premium" class="text-2xl font-bold">R$ 0,00</p>
            </div>
            <div class="bg-white rounded-lg shadow p-4">
                <h3 class="text-sm text-gray-500">Prêmios Totais</h3>
                <p id="stat-total-premium" class="text-2xl font-bold">R$ 0,00</p>
            </div>
        </div>

        <!-- Search and Add -->
        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <input type="text" id="search" placeholder="Buscar por nome, CPF ou placa..."
                class="flex-1 px-4 py-2 border rounded-lg">
            <button onclick="openModal()"
                class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                Novo Cliente
            </button>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-lg shadow overflow-x-auto">
            <table class="w-full">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">Nome</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">CPF</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">Cidade/UF</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">Veículo</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">Placa</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">Ações</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="flex justify-center gap-2 mt-4"></div>
    </div>
    <!-- Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-3xl mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b">
                <h2 id="modal-title" class="text-xl font-bold">Novo Cliente</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
            </div>
            <form id="client-form" onsubmit="saveClient(event)">
                <div class="flex border-b">
                    <button type="button" onclick="switchTab(0)" id="tab-btn-0"
                        class="flex-1 py-3 px-4 text-sm font-medium border-b-2 border-blue-600 text-blue-600">
                        Dados Pessoais
                    </button>
                    <button type="button" onclick="switchTab(1)" id="tab-btn-1"
                        class="flex-1 py-3 px-4 text-sm font-medium border-b-2 text-gray-400">
                        Endereço
                    </button>
                    <button type="button" onclick="switchTab(2)" id="tab-btn-2"
                        class="flex-1 py-3 px-4 text-sm font-medium border-b-2 text-gray-400">
                        Dados do Veículo
                    </button>
                </div>
                <div class="p-4">
                    <!-- Tab 0: Personal Data -->
                    <div id="tab-0" class="tab-content">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Nome *</label>
                                <input type="text" name="nome" required class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">CPF *</label>
                                <input type="text" name="cpf" required class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">RG</label>
                                <input type="text" name="rg" class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Data de Nascimento</label>
                                <input type="date" name="data_nascimento" class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Gênero</label>
                                <select name="genero" class="w-full px-3 py-2 border rounded">
                                    <option value="">Selecione</option>
                                    <option value="Masculino">Masculino</option>
                                    <option value="Feminino">Feminino</option>
                                    <option value="Outro">Outro</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Estado Civil</label>
                                <select name="estado_civil" class="w-full px-3 py-2 border rounded">
                                    <option value="">Selecione</option>
                                    <option value="Solteiro">Solteiro</option>
                                    <option value="Casado">Casado</option>
                                    <option value="Divorciado">Divorciado</option>
                                    <option value="Viúvo">Viúvo</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Profissão</label>
                                <input type="text" name="profissao" class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Email</label>
                                <input type="email" name="email" class="w-full px-3 py-2 border rounded">
                            </div>
                        </div>
                    </div>                    <!-- Tab 1: Address -->
                    <div id="tab-1" class="tab-content hidden">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">CEP</label>
                                <input type="text" name="cep" class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Logradouro</label>
                                <input type="text" name="logradouro" class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Número</label>
                                <input type="text" name="numero" class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Bairro</label>
                                <input type="text" name="bairro" class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Cidade</label>
                                <input type="text" name="cidade" class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Estado</label>
                                <input type="text" name="estado" maxlength="2" class="w-full px-3 py-2 border rounded">
                            </div>
                        </div>
                    </div>
                    <!-- Tab 2: Vehicle and Premium -->
                    <div id="tab-2" class="tab-content hidden">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Nº Apoase</label>
                                <input type="text" name="numero_apose" class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Marca</label>
                                <input type="text" name="marca" class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Modelo</label>
                                <input type="text" name="modelo" class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Placa</label>
                                <input type="text" name="placa" class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Cor</label>
                                <input type="text" name="cor" class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Ano</label>
                                <input type="number" name="ano_veiculo" min="1950" max="2030" class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Valor do Veículo (R$)</label>
                                <input type="number" name="valor_veiculo" step="0.01" class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Tipo de Cobertura</label>
                                <select name="tipo_cobertura" class="w-full px-3 py-2 border rounded">
                                    <option value="">Selecione</option>
                                    <option value="TPA">TPA</option>
                                    <option value="TP">TP</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Prêmio (R$)</label>
                                <input type="number" name="valor_premio" step="0.01" class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Data Início</label>
                                <input type="date" name="data_inicio" class="w-full px-3 py-2 border rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Data Fim</label>
                                <input type="date" name="data_fim" class="w-full px-3 py-2 border rounded">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex justify-end gap-4 p-4 border-t">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded">Cancelar</button>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Salvar</button>
                </div>
            </form>
        </div>
    </div>
    <script>
    let currentPage = 1;
    let pageSize = 10;
    let totalPages = 0;
    let editingId = null;
    let searchTimeout = null;

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        const div = document.createElement('div');
        div.textContent = String(str);
        return div.innerHTML;
    }

    async function loadClients() {
        const search = document.getElementById("search").value;
        let url = "/api/clientes?page=" + currentPage + "&pageSize=" + pageSize;
        if (search.trim()) url += "&search=" + encodeURIComponent(search.trim());
        try {
            const res = await fetch(url);
            const data = await res.json();
            const clients = data.data || [];
            totalPages = data.pagination ? data.pagination.totalPages : 1;
            renderTable(clients);
            renderPagination();
            loadStats();
        } catch (e) { console.error(e); }
    }

    function renderTable(clients) {
        const tbody = document.getElementById("table-body");
        if (!clients.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">Nenhum cliente encontrado</td></tr>';
            return;
        }
        let rows = "";
        for (let i = 0; i < clients.length; i++) {
            const c = clients[i];
            const nome = escapeHtml(c.nome) || "-";
            const cpf = escapeHtml(c.cpf) || "-";
            const cidade = escapeHtml(c.cidade) || "";
            const uf = escapeHtml(c.estado) || "";
            const cidadeUF = (cidade && uf) ? cidade + "/" + uf : (cidade || "-");
            const veiculo = (c.marca || c.modelo) ? escapeHtml(c.marca) + " " + escapeHtml(c.modelo) : "-";
            const placa = escapeHtml(c.placa) || "-";
            rows += '<tr class="border-b hover:bg-gray-50">'
                + '<td class="px-4 py-3">' + nome + '</td>'
                + '<td class="px-4 py-3">' + cpf + '</td>'
                + '<td class="px-4 py-3">' + cidadeUF + '</td>'
                + '<td class="px-4 py-3">' + veiculo + '</td>'
                + '<td class="px-4 py-3">' + placa + '</td>'
                + '<td class="px-4 py-3">'
                + '<button onclick="editClient(' + c.id + ')" class="text-blue-600 hover:text-blue-800 mr-2">Editar</button>'
                + '<button onclick="deleteClient(' + c.id + ')" class="text-red-600 hover:text-red-800">Excluir</button>'
                + '</td></tr>';
        }
        tbody.innerHTML = rows;
    }

    function renderPagination() {
        var pag = document.getElementById("pagination");
        if (totalPages <= 1) { pag.innerHTML = ""; return; }
        var html = "";
        if (currentPage > 1) {
            html += '<button onclick="goToPage(' + (currentPage - 1) + ')" class="px-3 py-1 border rounded">Anterior</button>';
        }
        html += '<span class="px-3 py-1">' + currentPage + ' de ' + totalPages + '</span>';
        if (currentPage < totalPages) {
            html += '<button onclick="goToPage(' + (currentPage + 1) + ')" class="px-3 py-1 border rounded">Próximo</button>';
        }
        pag.innerHTML = html;
    }

    function goToPage(page) {
        currentPage = page;
        loadClients();
    }

    async function loadStats() {
        try {
            const res = await fetch("/api/stats");
            const stats = await res.json();
            document.getElementById("stat-total").textContent = stats.totalClientes || 0;
            document.getElementById("stat-active").textContent = stats.totalApos || 0;
            document.getElementById("stat-premium").textContent = "R$ " + (stats.premioMedio || 0).toFixed(2).replace(".", ",");
            document.getElementById("stat-total-premium").textContent = "R$ " + (stats.totalPremios || 0).toFixed(2).replace(".", ",");
        } catch (e) { console.error("Stats error:", e); }
    }
    function openModal() {
        editingId = null;
        document.getElementById("client-form").reset();
        document.getElementById("modal-title").textContent = "Novo Cliente";
        document.getElementById("modal").classList.remove("hidden");
        switchTab(0);
    }

    function closeModal() {
        document.getElementById("modal").classList.add("hidden");
        editingId = null;
    }

    function switchTab(index) {
        var tabs = document.querySelectorAll(".tab-content");
        for (var i = 0; i < tabs.length; i++) {
            if (i === index) tabs[i].classList.remove("hidden");
            else tabs[i].classList.add("hidden");
        }
        for (var i = 0; i < 3; i++) {
            var btn = document.getElementById("tab-btn-" + i);
            if (i === index) {
                btn.classList.add("border-blue-600", "text-blue-600");
                btn.classList.remove("text-gray-400");
            } else {
                btn.classList.remove("border-blue-600", "text-blue-600");
                btn.classList.add("text-gray-400");
            }
        }
    }

    async function saveClient(e) {
        e.preventDefault();
        var form = document.getElementById("client-form");
        var formData = new FormData(form);
        var data = {};
        formData.forEach(function(value, key) { data[key] = value; });
        try {
            var url, method;
            if (editingId) {
                url = "/api/clientes/" + editingId;
                method = "PUT";
            } else {
                url = "/api/clientes";
                method = "POST";
            }
            var res = await fetch(url, {
                method: method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            if (!res.ok) throw new Error(await res.text());
            closeModal();
            loadClients();
        } catch (err) {
            alert("Erro ao salvar: " + err.message);
        }
    }
    async function editClient(id) {
        try {
            var res = await fetch("/api/clientes/" + id);
            var client = await res.json();
            editingId = id;
            document.getElementById("modal-title").textContent = "Editar Cliente";
            var form = document.getElementById("client-form");
            var fields = form.querySelectorAll("input, select");
            for (var j = 0; j < fields.length; j++) {
                var f = fields[j];
                if (client[f.name] !== undefined && client[f.name] !== null) {
                    f.value = client[f.name];
                }
            }
            document.getElementById("modal").classList.remove("hidden");
            switchTab(0);
        } catch (err) {
            alert("Erro ao carregar cliente: " + err.message);
        }
    }

    async function deleteClient(id) {
        if (!confirm("Tem certeza que deseja excluir este cliente?")) return;
        try {
            var res = await fetch("/api/clientes/" + id, { method: "DELETE" });
            if (!res.ok) throw new Error(await res.text());
            loadClients();
        } catch (err) {
            alert("Erro ao excluir: " + err.message);
        }
    }

    document.getElementById("search").addEventListener("input", function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(function() {
            currentPage = 1;
            loadClients();
        }, 300);
    });

    loadClients();
    </script>
</body>
</html>
