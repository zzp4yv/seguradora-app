version: '3.8'

services:
  app:
    build: .
    container_name: seguradora-app
    user: "0:0"
    ports:
      - "${HOST_PORT:-3001}:3001"
    volumes:
      - seguradora_data:/app/data
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/seguradora.db
    restart: unless-stopped

volumes:
  seguradora_data: