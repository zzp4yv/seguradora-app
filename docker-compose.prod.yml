# Configuração de produção usada pelo CD (runner self-hosted na dockeroxi).
# O deploy cria/copia este arquivo em /opt/seguradora-app/docker-compose.prod.yml
# e roda: docker compose -f docker-compose.prod.yml --env-file .env up -d --build

version: '3.8'

services:
  app:
    build:
      context: /opt/seguradora-app/src
    container_name: seguradora-app
    user: "0:0"
    ports:
      - "${HOST_PORT:-3001}:3001"
    volumes:
      - /opt/seguradora-app/data:/app/data
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/seguradora.db
    restart: unless-stopped